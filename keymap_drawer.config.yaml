# keymap-drawer configuration file
# This file defines how to parse and draw your keyboard layout diagrams

parse_config:
  # Remove specific prefixes (if you use locale headers)
  zmk_remove_keycode_prefix: []
  
  # Custom key mapping - Makes generated diagrams cleaner and more readable
  raw_binding_map:
    "&bootloader": "BOOT"
    "&sys_reset": "RST"
    "&bt BT_CLR": "BT CLR"
    "&bt BT_SEL 0": "BT 0"
    "&bt BT_SEL 1": "BT 1"
    "&bt BT_SEL 2": "BT 2"
    "&bt BT_SEL 3": "BT 3"
    "&bt BT_SEL 4": "BT 4"
    "&rgb_ug RGB_TOG": "RGB"
    "&rgb_ug RGB_EFF": "EFF"
    "&rgb_ug RGB_HUI": "HUI"
    "&rgb_ug RGB_HUD": "HUD"
    "&rgb_ug RGB_SAI": "SAI"
    "&rgb_ug RGB_SAD": "SAD"
    "&rgb_ug RGB_BRI": "BRI"
    "&rgb_ug RGB_BRD": "BRD"
    "&kp C_VOL_UP": "VOL+"
    "&kp C_VOL_DN": "VOL-"
    "&kp C_MUTE": "MUTE"
    "&kp C_PP": "PLAY"
    "&kp C_PREV": "PREV"
    "&kp C_NEXT": "NEXT"

draw_config:
  # Overall layout configuration
  key_rx: 6.0
  key_ry: 6.0
  key_w: 60.0
  key_h: 56.0
  
  # Font configuration
  key_font_size: 12
  combo_font_size: 11
  inner_pad_w: 4.0
  inner_pad_h: 8.0
  
  # Color theme - You can customize these colors
  svg_style: |
    /* Custom CSS styles */
    .keycap {
      fill: #f8f9fa;
      stroke: #dee2e6;
      stroke-width: 1;
    }
    .keycap.held {
      fill: #e3f2fd;
    }
    .keycap.ghost {
      stroke-dasharray: 3, 3;
      fill: #f5f5f5;
    }
    .held {
      fill: #64b5f6;
    }
    .combo {
      fill: #ffecb3;
      stroke: #ff8a65;
      stroke-width: 1;
    }
    .keycode {
      fill: #37474f;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .shifted {
      fill: #6c757d;
      font-size: 11px;
    }
    .hold {
      fill: #495057;
      font-size: 11px;
    }

  # SVG icon configuration - More useful icons
  glyphs:
    # Audio control icons
    vol_up: |
      <svg viewBox="0 0 24 24">
