# keymap-drawer configuration file
# This file defines how to parse and draw your keyboard layout diagrams

parse_config:
  # Remove specific prefixes (if you use locale headers)
  zmk_remove_keycode_prefix: []
  
  # Custom key mapping - Modern MDI icons (latest keymap-drawer style)
  raw_binding_map:
    "&bootloader": "$$mdi:restart$$"
    "&sys_reset": "$$mdi:restart-alert$$"
    "&bt BT_CLR": "$$mdi:bluetooth-off$$"
    "&bt BT_SEL 0": "$$mdi:numeric-1-circle$$"
    "&bt BT_SEL 1": "$$mdi:numeric-2-circle$$"
    "&bt BT_SEL 2": "$$mdi:numeric-3-circle$$"
    "&bt BT_SEL 3": "$$mdi:numeric-4-circle$$"
    "&bt BT_SEL 4": "$$mdi:numeric-5-circle$$"
    "&rgb_ug RGB_TOG": "$$mdi:led-strip-variant$$"
    "&rgb_ug RGB_EFF": "$$mdi:auto-mode$$"
    "&rgb_ug RGB_HUI": "$$mdi:palette$$"
    "&rgb_ug RGB_HUD": "$$mdi:palette-outline$$"
    "&rgb_ug RGB_SAI": "$$mdi:water-plus$$"
    "&rgb_ug RGB_SAD": "$$mdi:water-minus$$"
    "&rgb_ug RGB_BRI": "$$mdi:brightness-7$$"
    "&rgb_ug RGB_BRD": "$$mdi:brightness-4$$"
    "&kp C_VOL_UP": "$$mdi:volume-plus$$"
    "&kp C_VOL_DN": "$$mdi:volume-minus$$"
    "&kp C_MUTE": "$$mdi:volume-off$$"
    "&kp C_PP": "$$mdi:play-pause$$"
    "&kp C_PREV": "$$mdi:skip-previous$$"
    "&kp C_NEXT": "$$mdi:skip-next$$"
    "&kp K_COPY": "$$mdi:content-copy$$"
    "&kp K_PASTE": "$$mdi:content-paste$$"
    "&kp HOME": "$$mdi:home$$"
    "&kp UP": "$$mdi:arrow-up$$"
    "&kp DOWN": "$$mdi:arrow-down$$"
    "&kp LEFT": "$$mdi:arrow-left$$"
    "&kp RIGHT": "$$mdi:arrow-right$$"
    "&kp ESC": "$$mdi:keyboard-esc$$"
    "&kp TAB": "$$mdi:keyboard-tab$$"
    "&kp ENTER": "$$mdi:keyboard-return$$"
    "&kp SPACE": "$$mdi:keyboard-space$$"
    "&kp BSPC": "$$mdi:backspace-outline$$"
    "&kp DEL": "$$mdi:backspace-reverse-outline$$"

draw_config:
  # Clean layout configuration matching caksoylar examples
  key_rx: 6.0
  key_ry: 6.0
  key_w: 60.0
  key_h: 56.0
  
  # Typography - clean and readable
  key_font_size: 14
  combo_font_size: 12
  inner_pad_w: 4.0
  inner_pad_h: 8.0
  
  # Light modern theme - matches official examples
  svg_style: |
    /* Clean light theme based on keymap-drawer defaults */
    .key {
      fill: #ffffff;
      stroke: #ddd;
      stroke-width: 1;
      rx: 6;
      ry: 6;
    }
    .key.held {
      fill: #f0f0f0;
    }
    .key.ghost {
      stroke-dasharray: 3, 3;
      fill: #f8f8f8;
    }
    .combo {
      fill: #fff3cd;
      stroke: #ffc107;
      stroke-width: 1;
    }
    text.key {
      fill: #333;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-weight: 400;
    }
    text.combo {
      fill: #856404;
      font-weight: 500;
    }
    text.held {
      fill: #666;
      font-size: 11px;
    }
    text.shifted {
      fill: #666;
      font-size: 11px;
    }
    text.tap {
      fill: #333;
    }
    text.label {
      fill: #495057;
      font-weight: 600;
    }

  # Use MDI (Material Design Icons) - keymap-drawer fetches automatically
  # No need to define custom glyphs when using $$mdi:icon-name$$ format
