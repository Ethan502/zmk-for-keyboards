        <path fill="#374151" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
      </svg>
    arrow_down: |
      <svg viewBox="0 0 24 24">
        <path fill="#374151" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
      </svg>
    arrow_left: |
