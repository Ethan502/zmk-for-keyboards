        <path fill="#2563eb" d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71L13.41 12l4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm0 8.34l1.88 1.88L13 18.17v-3.76z"/>
      </svg>
    wifi: |
