# keymap-drawer configuration file
# This file defines how to parse and draw your keyboard layout diagrams

parse_config:
  # Remove specific prefixes (if you use locale headers)
  zmk_remove_keycode_prefix: []
  
  # Custom key mapping - Modern and clean display with SVG icons
  raw_binding_map:
    "&bootloader": "$$settings$$"
    "&sys_reset": "$$settings$$"
    "&bt BT_CLR": "$$bluetooth$$"
    "&bt BT_SEL 0": "BT 1"
    "&bt BT_SEL 1": "BT 2"
    "&bt BT_SEL 2": "BT 3"
    "&bt BT_SEL 3": "BT 4"
    "&bt BT_SEL 4": "BT 5"
    "&rgb_ug RGB_TOG": "$$rgb$$"
    "&rgb_ug RGB_EFF": "RGB+"
    "&rgb_ug RGB_HUI": "H+"
    "&rgb_ug RGB_HUD": "H-"
    "&rgb_ug RGB_SAI": "S+"
    "&rgb_ug RGB_SAD": "S-"
    "&rgb_ug RGB_BRI": "$$brightness$$"
    "&rgb_ug RGB_BRD": "DIM"
    "&kp C_VOL_UP": "$$vol_up$$"
    "&kp C_VOL_DN": "$$vol_down$$"
    "&kp C_MUTE": "$$mute$$"
    "&kp C_PP": "$$play$$"
    "&kp C_PREV": "$$prev$$"
    "&kp C_NEXT": "$$next$$"
    "&kp K_COPY": "$$copy$$"
    "&kp K_PASTE": "$$paste$$"
    "&kp HOME": "$$home$$"
    "&kp UP": "$$arrow_up$$"
    "&kp DOWN": "$$arrow_down$$"
    "&kp LEFT": "$$arrow_left$$"
    "&kp RIGHT": "$$arrow_right$$"

draw_config:
  # Modern layout configuration for crisp, clean look
  key_rx: 6.0
  key_ry: 6.0
  key_w: 64.0
  key_h: 64.0
  
  # Typography - cleaner fonts and better spacing
  key_font_size: 14
  combo_font_size: 12
  inner_pad_w: 6.0
  inner_pad_h: 8.0
  outer_pad_w: 30.0
  outer_pad_h: 20.0
  
  # Modern color theme - inspired by latest keymap-drawer examples
  svg_style: |
    /* Modern keymap-drawer style with light theme */
    .key {
      fill: #ffffff;
      stroke: #e1e5e9;
      stroke-width: 1.5;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
    }
    .key.held {
      fill: #f0f9ff;
      stroke: #0ea5e9;
      stroke-width: 2;
    }
    .key.ghost {
      stroke-dasharray: 4, 4;
      fill: #f8fafc;
      stroke: #cbd5e1;
    }
    .held {
      fill: #0ea5e9;
    }
    .combo {
      fill: #fef3c7;
      stroke: #f59e0b;
      stroke-width: 1.5;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
    }
    text.key {
      fill: #1e293b;
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
    }
    text.shifted {
      fill: #64748b;
      font-size: 12px;
      font-weight: 400;
    }
    text.hold {
      fill: #475569;
      font-size: 12px;
      font-weight: 400;
    }
    .combo.combo_text {
      fill: #92400e;
      font-weight: 600;
    }
    /* Layer styling */
    text.label {
      fill: #334155;
      font-size: 16px;
      font-weight: 600;
    }
    /* Background styling */
    rect.background {
      fill: #fefefe;
    }

  # SVG icon configuration - Modern icon set with consistent styling
  glyph_tap_size: 18
  glyph_hold_size: 16
  glyph_shifted_size: 14
  
  glyphs:
    # Audio control icons - Material Design style
    vol_up: |
      <svg viewBox="0 0 24 24">
        <path fill="#1e293b" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    vol_down: |
      <svg viewBox="0 0 24 24">
        <path fill="#1e293b" d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
      </svg>
    mute: |
      <svg viewBox="0 0 24 24">
        <path fill="#dc2626" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27L7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.32 2.63-.95 3.68-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    
    # Media control icons - Modern filled style
    play: |
      <svg viewBox="0 0 24 24">
        <path fill="#059669" d="M8 5v14l11-7z"/>
      </svg>
    pause: |
      <svg viewBox="0 0 24 24">
        <path fill="#d97706" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    next: |
      <svg viewBox="0 0 24 24">
        <path fill="#1e293b" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
      </svg>
    prev: |
      <svg viewBox="0 0 24 24">
        <path fill="#1e293b" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
      </svg>
    
    # System control icons - Refined design
    bluetooth: |
