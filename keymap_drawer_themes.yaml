# Advanced keymap-drawer configuration
# Generate multiple themed keyboard layout diagrams

# Default configuration
default: &default_config
  parse_config:
    zmk_remove_keycode_prefix: []
    raw_binding_map:
      "&bootloader": "BOOT"
      "&sys_reset": "RST"
      "&bt BT_CLR": "BT CLR"
      "&bt BT_SEL 0": "BT 0"
      "&bt BT_SEL 1": "BT 1"
      "&bt BT_SEL 2": "BT 2"
      "&bt BT_SEL 3": "BT 3"
      "&bt BT_SEL 4": "BT 4"
      "&rgb_ug RGB_TOG": "RGB"

  draw_config:
    key_rx: 6.0
    key_ry: 6.0
    key_w: 60.0
    key_h: 56.0
    key_font_size: 12
    combo_font_size: 11

# Light theme
light_theme:
  <<: *default_config
  draw_config:
    <<: *default_config.draw_config
    svg_style: |
      .keycap { fill: #ffffff; stroke: #cccccc; stroke-width: 1; }
      .keycap.held { fill: #e3f2fd; }
      .combo { fill: #fff3e0; stroke: #ff8a65; }
      .keycode { fill: #333333; }

# Dark theme
dark_theme:
  <<: *default_config
  draw_config:
    <<: *default_config.draw_config
    svg_style: |
      .keycap { fill: #2d2d2d; stroke: #555555; stroke-width: 1; }
      .keycap.held { fill: #1e3a8a; }
      .combo { fill: #3f3f46; stroke: #f59e0b; }
      .keycode { fill: #ffffff; }

# Classic theme
classic_theme:
  <<: *default_config
  draw_config:
    <<: *default_config.draw_config
    svg_style: |
      .keycap { fill: #f5f5f5; stroke: #999999; stroke-width: 2; }
      .keycap.held { fill: #dbeafe; }
      .combo { fill: #fef3c7; stroke: #d97706; }
      .keycode { fill: #1f2937; font-weight: bold; }
