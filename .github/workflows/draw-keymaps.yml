name: Draw ZMK keymaps
on:
  workflow_dispatch:  # Can be triggered manually
  push:               # Automatically run on changes to following paths
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/miryoku/*.keymap"
      - "config/miryoku/*.dtsi"
      - "keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write  # Allow workflow to commit to the repo
    with:
      keymap_patterns: "config/*.keymap config/miryoku/*.keymap"  # Keymap file paths to parse
      config_path: "keymap_drawer.config.yaml"                   # Config file, ignored if not exists
      output_folder: "keymap-drawer"                              # Path to save generated SVG and YAML files
      parse_args: ""  # Extra args to pass to `keymap parse`
      draw_args: ""   # Extra args to pass to `keymap draw`
