name: Generate Keymap Diagrams

on:
  push:
    branches: [ main, zmk-for-corne ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-keymaps:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install keymap-drawer PyYAML
        
    - name: Generate 1-Column Layout
      run: |
        keymap -c config_1_column.yaml draw keymap-drawer/corne.yaml -o keymap-drawer/corne_1_column.svg
        
    - name: Generate 2-Column Layout (Compact)
      run: |
        keymap -c config_2_columns.yaml draw keymap-drawer/corne.yaml -o keymap-drawer/corne_2_columns.svg
        
    - name: Generate 3-Column Layout (Very Compact)
      run: |
        keymap -c config_3_columns.yaml draw keymap-drawer/corne.yaml -o keymap-drawer/corne_3_columns.svg
        
    - name: Generate Dark Theme
      run: |
        keymap -c config_dark.yaml draw keymap-drawer/corne.yaml -o keymap-drawer/corne_dark.svg
        
    - name: Generate Raw Configuration Layout
      run: |
        keymap -c raw_configuration.yaml draw keymap-drawer/corne.yaml -o keymap-drawer/corne_raw_config.svg
        
    - name: Create layer generation script
      run: |
        cat > generate_layers.py << 'EOF'
        import yaml
        import subprocess
        import os
        
        # Create layers directory
        os.makedirs('keymap-drawer/layers', exist_ok=True)
        
        # Read keymap file to get layer names
        with open('keymap-drawer/corne.yaml', 'r') as f:
            data = yaml.safe_load(f)
            layers = data.get('layers', {})
            
        print(f'Found {len(layers)} layers: {list(layers.keys())}')
        
        # Generate SVG for each layer using raw_configuration.yaml without combos
        for layer_name in layers.keys():
            output_path = f'keymap-drawer/layers/{layer_name.lower()}.svg'
            cmd = [
                'keymap', 
                '-c', 'raw_configuration.yaml', 
                'draw', 'keymap-drawer/corne.yaml', 
                '-o', output_path,
                '-s', layer_name,
                '--keys-only'
            ]
            print(f'Generating {layer_name} -> {output_path}')
            try:
                result = subprocess.run(cmd, check=True, capture_output=True, text=True)
                print(f'✅ Successfully generated {layer_name}')
            except subprocess.CalledProcessError as e:
                print(f'❌ Error generating {layer_name}: {e}')
                print(f'Command output: {e.stdout}')
                print(f'Command error: {e.stderr}')
                raise
                
        print('All layer diagrams generated successfully!')
        EOF
        
    - name: Generate Individual Layer Diagrams
      run: |
        python3 generate_layers.py
        
    - name: Generate Combos Diagram
      run: |
        keymap -c raw_configuration.yaml draw keymap-drawer/corne.yaml -o keymap-drawer/corne_combos.svg --combos-only
        
    - name: Commit generated files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        mkdir -p keymap-drawer/layers
        git add keymap-drawer/*.svg keymap-drawer/layers/*.svg
        git diff --staged --quiet || git commit -m "Auto-update keymap diagrams [skip ci]"
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
